<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NGO Dashboard | Food Management</title>

    <link
      rel="stylesheet"
      href="../node_modules/bootstrap/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../css/dashboard-clean.css" />
  </head>

  <body class="dashboard-bg">
    <nav class="navbar navbar-light bg-white shadow-sm px-4">
      <span class="navbar-brand fw-bold text-success"> 🏢 NGO Dashboard </span>
      <button class="btn btn-outline-danger btn-sm">Logout</button>
    </nav>

    <div class="container mt-5">
      <h3 class="fw-bold mb-3">Available Donations</h3>

      <div class="card shadow-sm">
        <div class="card-body">
          <table class="table align-middle">
            <thead class="table-success">
              <tr>
                <th>#</th>
                <th>Donor</th>
                <th>Food</th>
                <th>Quantity</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody>
              <!-- Sample row (will be dynamic later) -->
              <tr>
                <td>1</td>
                <td>Ali Khan</td>
                <td>Cooked Rice</td>
                <td>10 Plates</td>
                <td>
                  <button
                    class="btn btn-success btn-sm me-2"
                    onclick="handleAccept()"
                  >
                    Accept
                  </button>
                  <button
                    class="btn btn-danger btn-sm"
                    onclick="handleReject()"
                  >
                    Reject
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      function handleAccept() {
        alert('Donation accepted. Rider is on the way 🚚');
      }

      function handleReject() {
        alert('Donation rejected.');
      }
    </script>
  </body>
</html>
