<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGO Login - Food Management</title>
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/ngo.css">
</head>

<body class="ngo-bg">
    <div class="container vh-100 d-flex flex-column justify-content-center align-items-center">
        <h2 class="text-light mb-3 fw-bold">Welcome Back, Change Maker 💪</h2>
        <div class="card p-4 shadow-lg bg-light" style="width: 400px;">
            <h4 class="text-center mb-3 text-success">NGO Login</h4>
            <form>
                <input type="email" class="form-control mb-3" placeholder="Email" required>
                <input type="password" class="form-control mb-3" placeholder="Password" required>
                <button class="btn btn-success w-100">Login</button>
            </form>
            <p class="text-center mt-3">New NGO? <a href="./ngo-register.html">Register</a></p>
        </div>
    </div>

    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
