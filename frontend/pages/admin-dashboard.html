<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Admin Dashboard | Food Management</title>

    <link
      rel="stylesheet"
      href="../node_modules/bootstrap/dist/css/bootstrap.min.css"
    />

    <style>
      body {
        background: #f5f7fb;
        font-family: 'Segoe UI', sans-serif;
      }

      .stat-card {
        border-radius: 16px;
        padding: 24px;
        transition: 0.2s ease;
      }

      .stat-card:hover {
        transform: translateY(-4px);
      }

      .stat-title {
        font-size: 0.85rem;
        color: #6c757d;
      }

      .stat-value {
        font-size: 2rem;
        font-weight: 700;
      }

      .action-card {
        border-radius: 16px;
        cursor: pointer;
        transition: 0.2s ease;
      }

      .action-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 10px 26px rgba(0, 0, 0, 0.08);
      }

      .action-icon {
        font-size: 2.2rem;
      }
    </style>
  </head>

  <body>
    <nav class="navbar navbar-light bg-white shadow-sm px-4">
      <span class="navbar-brand fw-bold text-success">🛡️ Admin Dashboard</span>
      <button class="btn btn-outline-danger btn-sm" onclick="logout()">
        Logout
      </button>
    </nav>

    <div class="container mt-5">
      <!-- STATS -->
      <div class="row g-4 mb-4">
        <div class="col-md-4">
          <div class="bg-white shadow-sm stat-card">
            <div class="stat-title">Total Donors</div>
            <div class="stat-value text-primary" id="totalDonors">0</div>
          </div>
        </div>

        <div class="col-md-4">
          <div class="bg-white shadow-sm stat-card">
            <div class="stat-title">Total NGOs</div>
            <div class="stat-value text-success" id="totalNgos">0</div>
          </div>
        </div>

        <div class="col-md-4">
          <div class="bg-white shadow-sm stat-card">
            <div class="stat-title">Total Donations</div>
            <div class="stat-value text-danger" id="totalDonations">0</div>
          </div>
        </div>
      </div>

      <!-- ACTIONS -->
      <h5 class="fw-bold mb-3">Quick Actions</h5>

      <div class="row g-4">
        <div class="col-md-6">
          <div
            class="bg-white shadow-sm p-4 action-card"
            onclick="location.href = './admin-donations.html'"
          >
            <div class="action-icon mb-2">📦</div>
            <h6 class="fw-bold">View Donations</h6>
            <p class="text-muted mb-0">Monitor all donations</p>
          </div>
        </div>

        <div class="col-md-6">
          <div
            class="bg-white shadow-sm p-4 action-card"
            onclick="location.href = './admin-users.html'"
          >
            <div class="action-icon mb-2">👥</div>
            <h6 class="fw-bold">View Users</h6>
            <p class="text-muted mb-0">Donors & NGOs</p>
          </div>
        </div>
      </div>
    </div>

    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/logout.js"></script>
    <script src="../js/admin-dashboard.js"></script>
  </body>
</html>
