<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Donor Dashboard | Food Management</title>

    <link
      rel="stylesheet"
      href="../node_modules/bootstrap/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../css/dashboard-clean.css" />
  </head>

  <body class="dashboard-bg">
    <nav class="navbar navbar-light bg-white shadow-sm px-4">
      <span class="navbar-brand fw-bold text-success">
        🍱 Donor Dashboard
      </span>
      <button class="btn btn-outline-danger btn-sm">Logout</button>
    </nav>

    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-8 text-center">
          <h2 class="fw-bold mb-3">Welcome, Donor 👋</h2>
          <p class="text-muted mb-4">
            Thank you for helping reduce food waste and fight hunger.
          </p>

          <div class="card shadow-sm p-4">
            <h5 class="fw-bold mb-3">Quick Actions</h5>

            <a href="./donation.html" class="btn btn-success btn-lg w-100 mb-3">
              ➕ Create a Donation
            </a>

            <button class="btn btn-outline-secondary w-100">
              📦 View My Donations (Coming Soon)
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
