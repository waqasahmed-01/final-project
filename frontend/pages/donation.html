<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Donation | Food Management</title>

    <!-- Bootstrap CSS -->
    <link
      href="../node_modules/bootstrap/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: linear-gradient(135deg, #e3f2fd, #e8f5e9);
        min-height: 100vh;
        font-family: 'Poppins', sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .donation-card {
        width: 100%;
        max-width: 650px;
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(12px);
        border-radius: 20px;
        padding: 35px;
        box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.1);
        animation: fadeIn 0.6s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .donation-card h2 {
        font-weight: 700;
        text-align: center;
        margin-bottom: 1.5rem;
        color: #007bff;
      }

      .form-label {
        font-weight: 500;
      }

      .btn-donate {
        width: 100%;
        padding: 12px;
        border-radius: 12px;
        font-weight: 600;
        font-size: 1rem;
        background: #007bff;
        border: none;
        transition: 0.3s ease-in-out;
      }

      .btn-donate:hover {
        background: #0056b3;
        transform: translateY(-2px);
      }

      .badge-type {
        font-size: 0.8rem;
        padding: 6px 10px;
        border-radius: 8px;
      }
      #formMessage {
        padding: 10px 14px;
        border-radius: 8px;
        display: none;
        font-size: 0.95rem;
      }

      .msg-error {
        background: #ffebee;
        color: #c62828;
        border-left: 4px solid #c62828;
      }

      .msg-success {
        background: #e8f5e9;
        color: #2e7d32;
        border-left: 4px solid #2e7d32;
      }
    </style>
  </head>

  <body>
    <div class="donation-card">
      <h2>Donate Food & Feed Lives 🍲💙</h2>

      <form id="donationForm">
        <!-- Food Name -->
        <div class="mb-3">
          <label class="form-label">Food Name</label>
          <input
            type="text"
            id="foodName"
            class="form-control"
            placeholder="e.g., Biryani, Bread, Fruits"
            required
          />
        </div>

        <!-- Food Type -->
        <div class="mb-3">
          <label class="form-label">Food Type</label>
          <select id="foodType" class="form-select" required>
            <option value="" disabled selected>Select Food Type</option>
            <option value="cooked">🍛 Cooked</option>
            <option value="raw">🥬 Raw</option>
            <option value="packaged">📦 Packaged</option>
          </select>
        </div>

        <!-- Quantity -->
        <div class="mb-3">
          <label class="form-label">Quantity / Meals</label>
          <input
            type="text"
            id="quantity"
            class="form-control"
            placeholder="e.g., 10 plates, 5kg, 3 packs"
            required
          />
        </div>

        <!-- Pickup Address -->
        <div class="mb-3">
          <label class="form-label">Pickup Location</label>
          <textarea
            id="location"
            class="form-control"
            rows="3"
            placeholder="Enter pickup address"
            required
          ></textarea>
        </div>
        <p id="formMessage" class="text-center fw-semibold mt-2"></p>

        <!-- Submit btn -->
        <button type="submit" class="btn btn-donate">Submit Donation</button>
      </form>
    </div>

    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/donation-create.js"></script>
  </body>
</html>
