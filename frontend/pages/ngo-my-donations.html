<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Donations | NGO</title>

    <link
      rel="stylesheet"
      href="../node_modules/bootstrap/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../css/dashboard-clean.css" />
  </head>

  <body class="dashboard-bg">
    <nav class="navbar navbar-light bg-white shadow-sm px-4">
      <span class="navbar-brand fw-bold text-success">
        📦 My Handled Donations
      </span>
      <a href="./ngo-dashboard.html" class="btn btn-outline-secondary btn-sm">
        ← Back
      </a>
    </nav>

    <div class="container mt-5">
      <div class="card shadow-sm">
        <div class="card-body">
          <div id="pageMessage" class="mb-3"></div>

          <table class="table align-middle">
            <thead class="table-success">
              <tr>
                <th>#</th>
                <th>Food</th>
                <th>Donor</th>
                <th>Contact</th>
                <th>Quantity</th>
                <th>Cost</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="donationsTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/ngo-my-donations.js"></script>
  </body>
</html>
