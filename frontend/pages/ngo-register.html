<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NGO Register - Food Management</title>

    <link
      rel="stylesheet"
      href="../node_modules/bootstrap/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../css/ngo.css" />
  </head>

  <body class="ngo-bg">
    <div
      class="container vh-100 d-flex flex-column justify-content-center align-items-center"
    >
      <h1 class="text-light mb-3 fw-bold text-center">
        Together, we can end hunger and reduce waste 🌍
      </h1>

      <div class="card p-4 shadow-lg bg-light" style="width: 400px">
        <h4 class="text-center mb-3 text-success">NGO Registration</h4>

        <form>
          <input
            type="text"
            class="form-control mb-3"
            placeholder="NGO Name"
            required
          />

          <input
            type="email"
            class="form-control mb-3"
            placeholder="Official Email"
            required
          />

          <input
            type="password"
            class="form-control mb-3"
            placeholder="Password"
            required
          />

          <!-- ✅ FIX: submit button -->
          <button type="submit" class="btn btn-success w-100">Register</button>
        </form>

        <!-- ✅ message container -->
        <p class="text-center mt-3" id="final"></p>

        <p class="text-center mt-2">
          Already registered? <a href="./ngo-login.html">Login</a>
        </p>
      </div>
    </div>

    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>

    <!-- ✅ link JS -->
    <script src="../js/ngo-register.js"></script>
  </body>
</html>
